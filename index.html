<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta 
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>STAR//FALL 1997</title>


<style>

@import url(
    'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap'
);


*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#08050e;

    font-family:
        "Press Start 2P",
        monospace;

}


body{

    display:flex;

    justify-content:center;

    align-items:center;

}


.arcade{

    position:relative;

    width:
        min(
            94vw,
            1400px,
            calc(88vh * 4 / 3)
        );

    aspect-ratio:4/3;

    background:#090611;

    border:10px solid #2b2340;

    box-shadow:

        0 0 0 5px #050309,

        0 0 45px #8b32ff55,

        inset 0 0 35px #000;

    overflow:hidden;

}


canvas{

    width:100%;
    height:100%;

    display:block;

    image-rendering:pixelated;
    image-rendering:crisp-edges;

}


.arcade:after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:5;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(255,255,255,.025)
            0 1px,

            transparent
            1px 4px

        );

}


.mobile-controls{

    display:none;

    position:fixed;

    left:12px;
    right:12px;

    bottom:14px;

    justify-content:space-between;

    z-index:20;

}


.dpad,
.action-buttons{

    display:flex;

    gap:6px;

}


.mobile-controls button{

    width:52px;
    height:52px;

    border:3px solid #8f6bca;

    background:#1a1127;

    color:white;

    font-family:inherit;

    font-size:12px;

}


@media(max-width:700px){

    .mobile-controls{

        display:flex;

    }


    .arcade{

        width:94vw;

        border-width:6px;

    }

}

</style>

</head>


<body>


<div class="arcade">

    <canvas id="game"></canvas>

</div>


<div class="mobile-controls">

    <div class="dpad">

        <button data-key="ArrowLeft">◀</button>

        <button data-key="ArrowUp">▲</button>
        <button data-key="ArrowDown">▼</button>
        <button data-key="ArrowRight">▶</button>

    </div>


    <div class="action-buttons">

        <button data-key="Space">●</button>

    </div>

</div>



<script>

"use strict";


/* =========================================================
   STAR//FALL 1997
   =========================================================

   PHASE 2.1
   ---------------------------------------------------------
   WEAPON POWER-UPS

   NORMAL
   SPREAD
   RAPID
   LASER
   MISSILE

   ========================================================= */


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const W = 640;
const H = 480;


canvas.width = W;
canvas.height = H;


ctx.imageSmoothingEnabled = false;



/* =========================================================
   GAME STATE
   ========================================================= */

let state = "title";

let paused = false;

let score = 0;


let highScore =
    Number(
        localStorage.getItem(
            "starFallHighScore"
        ) || 0
    );


let lives = 3;

const MAX_LIVES = 5;

let level = 1;

let frame = 0;

let enemyTimer = 10;

let heartTimer = 650;

let powerUpTimer = 500;

let shake = 0;


const keys = {};



/* =========================================================
   ATTRACT MODE
   ========================================================= */

const ATTRACT_DELAY =
    60 * 20;


const ATTRACT_DURATION =
    60 * 32;


let attractTimer = 0;

let attractFrame = 0;


let demoScore = 0;

let demoLives = 3;

let demoLevel = 1;


let demoTargetX =
    W / 2;


let demoTargetY =
    H - 100;



/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x: W / 2,

    y: H - 75,

    w: 38,

    h: 42,

    speed: 4,

    cooldown: 0,

    invincible: 0,

    weapon: "normal",

    weaponTimer: 0

};



/* =========================================================
   OBJECT ARRAYS
   ========================================================= */

let bullets = [];

let enemies = [];

let hearts = [];

let powerUps = [];

let particles = [];

let stars = [];


/* =========================================================
   BOSS SYSTEM
   ---------------------------------------------------------
   A boss appears at levels 20, 40, 60, 80 and 100.
   Level 100 is the FINAL BOSS.
   No campaign/stage system is added here.
   ========================================================= */

let boss = null;
let bossBullets = [];
let nextBossLevel = 20;

const BOSS_LEVELS = [20, 40, 60, 80, 100];

function isBossLevel(levelNumber){

    return BOSS_LEVELS.includes(levelNumber);

}



/* =========================================================
   STARFIELD
   ========================================================= */

for(
    let i = 0;
    i < 190;
    i++
){

    stars.push({

        x:
            Math.random() * W,

        y:
            Math.random() * H,

        speed:
            .35 +
            Math.random() * 1.6,

        size:
            Math.random() < .88
            ? 1
            : 2

    });

}



/* =========================================================
   TITLE LOGO
   ========================================================= */

const LOGO_FONT = {

    S:[
        "11111",
        "10000",
        "10000",
        "11111",
        "00001",
        "00001",
        "11111"
    ],

    T:[
        "11111",
        "00100",
        "00100",
        "00100",
        "00100",
        "00100",
        "00100"
    ],

    A:[
        "01110",
        "10001",
        "10001",
        "11111",
        "10001",
        "10001",
        "10001"
    ],

    R:[
        "11110",
        "10001",
        "10001",
        "11110",
        "10100",
        "10010",
        "10001"
    ],

    F:[
        "11111",
        "10000",
        "10000",
        "11110",
        "10000",
        "10000",
        "10000"
    ],

    L:[
        "10000",
        "10000",
        "10000",
        "10000",
        "10000",
        "10000",
        "11111"
    ]

};


const logoLetters = [];


function setupLogo(){

    logoLetters.length = 0;


    const words = [

        {
            text:"STAR",
            y:92,
            scale:7,
            delay:0
        },

        {
            text:"FALL",
            y:190,
            scale:7,
            delay:24
        }

    ];


    for(
        const word of words
    ){

        const spacing =
            11 * word.scale;


        const totalWidth =

            word.text.length *
            5 *
            word.scale

            +

            (
                word.text.length - 1
            ) *
            spacing;


        const startX =
            (
                W -
                totalWidth
            ) / 2;


        for(
            let i = 0;
            i < word.text.length;
            i++
        ){

            logoLetters.push({

                char:
                    word.text[i],

                x:
                    startX +
                    i *
                    (
                        5 *
                        word.scale +
                        spacing
                    ),

                targetY:
                    word.y,

                y:
                    -180 -
                    Math.random() * 160,

                scale:
                    word.scale,

                delay:
                    word.delay +
                    i * 7,

                velocity:0,

                landed:false,

                rotation:
                    (
                        Math.random() -
                        .5
                    ) * .04

            });

        }

    }

}


setupLogo();



function updateLogo(){

    for(
        const letter of logoLetters
    ){

        if(
            frame <
            letter.delay
        ){

            continue;

        }


        if(
            !letter.landed
        ){

            letter.velocity += .42;

            letter.y +=
                letter.velocity;


            if(
                letter.y >=
                letter.targetY
            ){

                letter.y =
                    letter.targetY;

                letter.velocity *=
                    -.28;


                if(
                    Math.abs(
                        letter.velocity
                    ) < .8
                ){

                    letter.velocity = 0;

                    letter.landed = true;

                }

            }

        }

    }

}



function drawPixelGlyph(
    char,
    x,
    y,
    scale,
    color,
    offsetX = 0,
    offsetY = 0
){

    const pattern =
        LOGO_FONT[char];


    if(!pattern) return;


    for(
        let row = 0;
        row < 7;
        row++
    ){

        for(
            let col = 0;
            col < 5;
            col++
        ){

            if(
                pattern[row][col] === "1"
            ){

                px(

                    x +
                    offsetX +
                    col *
                    scale,

                    y +
                    offsetY +
                    row *
                    scale,

                    scale,
                    scale,

                    color

                );

            }

        }

    }

}



function drawLogoLetter(letter){

    const x =
        Math.round(letter.x);

    const y =
        Math.round(letter.y);

    const s =
        letter.scale;


    drawPixelGlyph(
        letter.char,
        x - 2,
        y + 3,
        s,
        "#050509"
    );


    drawPixelGlyph(
        letter.char,
        x + 3,
        y + 2,
        s,
        "#050509"
    );


    drawPixelGlyph(
        letter.char,
        x - 4,
        y,
        s,
        "#54f5ff"
    );


    drawPixelGlyph(
        letter.char,
        x + 4,
        y,
        s,
        "#ff315d"
    );


    drawPixelGlyph(
        letter.char,
        x + 1,
        y - 2,
        s,
        "#fff04a"
    );


    drawPixelGlyph(
        letter.char,
        x,
        y,
        s,
        "#d9d9d9"
    );


    drawPixelGlyph(
        letter.char,
        x,
        y - 1,
        s,
        "#f4f4f4"
    );

}



function drawLogo(){

    for(
        const letter of logoLetters
    ){

        const originalX =
            letter.x;


        let glitchX = 0;


        if(
            letter.landed &&
            Math.random() < .012
        ){

            glitchX =
                Math.random() < .5
                ? -2
                : 2;

        }


        letter.x =
            originalX +
            glitchX;


        drawLogoLetter(letter);


        letter.x =
            originalX;

    }


    if(
        Math.floor(frame / 18) % 5 === 0
    ){

        for(
            let i = 0;
            i < 3;
            i++
        ){

            const y =
                70 +
                Math.random() *
                170;


            px(

                90 +
                Math.random() *
                400,

                y,

                25 +
                Math.random() *
                65,

                1,

                Math.random() < .5
                ? "#54f5ff"
                : "#ff315d"

            );

        }

    }

}



/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;


        if([
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "Space"
        ].includes(e.code)){

            e.preventDefault();

        }


        if(
            e.code === "Enter" &&
            (
                state === "title" ||
                state === "attract"
            )
        ){

            startGame();

        }


        if(
            e.code === "Space" &&
            (
                state === "title" ||
                state === "attract"
            )
        ){

            startGame();

        }


        if(
            state === "attract" &&
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "KeyW",
                "KeyA",
                "KeyS",
                "KeyD"
            ].includes(e.code)
        ){

            startGame();

        }


        if(
            e.code === "KeyR" &&
            state === "gameover"
        ){

            startGame();

        }


        if(
            e.code === "KeyP" &&
            state === "playing"
        ){

            paused = !paused;

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);



/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

document
.querySelectorAll(
    ".mobile-controls button"
)
.forEach(button => {

    const key =
        button.dataset.key;


    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            keys[key] = true;


            if(
                (
                    state === "title" ||
                    state === "attract"
                ) &&
                key === "Space"
            ){

                startGame();

            }


            if(
                state === "attract"
            ){

                startGame();

            }

        }
    );


    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );

});



/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx = null;


function initAudio(){

    if(!audioCtx){

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioCtx.state === "suspended"
    ){

        audioCtx.resume();

    }

}



function beep(
    frequency,
    duration,
    type = "square",
    volume = .025
){

    if(!audioCtx) return;


    const oscillator =
        audioCtx.createOscillator();


    const gain =
        audioCtx.createGain();


    oscillator.type =
        type;


    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,

        audioCtx.currentTime +
        duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    oscillator.start();


    oscillator.stop(
        audioCtx.currentTime +
        duration
    );

}



/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    initAudio();


    state =
        "playing";


    paused =
        false;


    score =
        0;


    lives =
        3;


    level =
        1;


    frame =
        0;


    enemyTimer =
        10;


    heartTimer =
        650;


    powerUpTimer =
        500;


    shake =
        0;


    bullets =
        [];


    enemies =
        [];


    hearts =
        [];


    powerUps =
        [];


    particles =
        [];


    boss =
        null;


    bossBullets =
        [];


    nextBossLevel =
        20;


    attractTimer =
        0;


    attractFrame =
        0;


    demoScore =
        0;


    player.x =
        W / 2;


    player.y =
        H - 75;


    player.cooldown =
        0;


    player.invincible =
        90;


    resetWeapon();


    beep(
        330,
        .09
    );


    setTimeout(
        () =>
            beep(
                660,
                .12
            ),
        90
    );

}



/* =========================================================
   WEAPON SYSTEM
   ========================================================= */

const WEAPON_DURATION = 60 * 14;


const WEAPON_DATA = {

    normal:{
        name:"NORMAL",
        color:"#ffffff"
    },

    spread:{
        name:"SPREAD",
        color:"#54f5ff"
    },

    rapid:{
        name:"RAPID",
        color:"#fff04a"
    },

    laser:{
        name:"LASER",
        color:"#ff315d"
    },

    missile:{
        name:"MISSILE",
        color:"#a84cff"
    }

};



function resetWeapon(){

    player.weapon =
        "normal";

    player.weaponTimer =
        0;

}



function giveWeapon(type){

    if(
        !WEAPON_DATA[type]
    ){

        return;

    }


    player.weapon =
        type;


    player.weaponTimer =
        WEAPON_DURATION;


    shake =
        3;


    explode(
        player.x,
        player.y,
        16
    );


    beep(
        420,
        .07,
        "square",
        .03
    );


    setTimeout(
        () =>
            beep(
                620,
                .07,
                "square",
                .03
            ),
        70
    );


    setTimeout(
        () =>
            beep(
                840,
                .1,
                "square",
                .028
            ),
        140
    );

}



function updateWeapon(){

    if(
        player.weapon === "normal"
    ){

        return;

    }


    if(
        player.weaponTimer > 0
    ){

        player.weaponTimer--;

    }


    if(
        player.weaponTimer <= 0
    ){

        resetWeapon();

    }

}



/* =========================================================
   POWER-UP SPAWNING
   ========================================================= */

function choosePowerUp(){

    const roll =
        Math.random();


    if(
        roll < .30
    ){

        return "spread";

    }


    if(
        roll < .55
    ){

        return "rapid";

    }


    if(
        roll < .78
    ){

        return "laser";

    }


    return "missile";

}



function spawnPowerUp(
    x,
    y,
    forcedType = null
){

    const type =
        forcedType ||
        choosePowerUp();


    powerUps.push({

        type,

        x,

        y,

        w:26,

        h:26,

        speed:.75,

        phase:
            Math.random() *
            Math.PI *
            2,

        life:
            60 * 15

    });

}



function maybeDropPowerUp(
    enemy
){

    /*
        Elite enemies have a better chance.
    */

    let chance =
        enemy.type === "elite"
        ? .20
        : enemy.type === "tank"
        ? .10
        : .055;


    if(
        Math.random() <
        chance
    ){

        spawnPowerUp(
            enemy.x,
            enemy.y
        );

    }

}



/* =========================================================
   POWER-UP UPDATE
   ========================================================= */

function updatePowerUps(){

    for(
        const powerUp of powerUps
    ){

        powerUp.y +=
            powerUp.speed;


        powerUp.x +=
            Math.sin(
                frame * .06 +
                powerUp.phase
            ) * .5;


        powerUp.life--;

    }


    for(
        let i =
            powerUps.length - 1;
        i >= 0;
        i--
    ){

        const powerUp =
            powerUps[i];


        if(
            hit(
                player,
                powerUp
            )
        ){

            giveWeapon(
                powerUp.type
            );


            powerUps.splice(
                i,
                1
            );


            continue;

        }


        if(
            powerUp.y >
                H + 50 ||
            powerUp.life <= 0
        ){

            powerUps.splice(
                i,
                1
            );

        }

    }

}



/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

    if(
        player.cooldown > 0
    ){

        return;

    }


    if(
        player.weapon === "spread"
    ){

        bullets.push(

            {
                x:player.x,
                y:player.y - 28,
                w:5,
                h:18,
                speed:10,
                vx:0,
                damage:1,
                type:"spread"
            },

            {
                x:player.x - 5,
                y:player.y - 25,
                w:5,
                h:18,
                speed:9.2,
                vx:-2.1,
                damage:1,
                type:"spread"
            },

            {
                x:player.x + 5,
                y:player.y - 25,
                w:5,
                h:18,
                speed:9.2,
                vx:2.1,
                damage:1,
                type:"spread"
            }

        );


        player.cooldown =
            10;


        beep(
            820,
            .035,
            "square",
            .018
        );


        return;

    }



    if(
        player.weapon === "rapid"
    ){

        bullets.push({

            x:player.x,

            y:player.y - 28,

            w:5,

            h:18,

            speed:11,

            vx:0,

            damage:1,

            type:"rapid"

        });


        player.cooldown =
            3;


        beep(
            1050,
            .025,
            "square",
            .014
        );


        return;

    }



    if(
        player.weapon === "laser"
    ){

        bullets.push({

            x:player.x,

            y:player.y - 40,

            w:10,

            h:55,

            speed:13,

            vx:0,

            damage:3,

            type:"laser",

            piercing:true

        });


        player.cooldown =
            13;


        beep(
            1250,
            .045,
            "sawtooth",
            .02
        );


        return;

    }



    if(
        player.weapon === "missile"
    ){

        bullets.push({

            x:player.x,

            y:player.y - 30,

            w:9,

            h:22,

            speed:7,

            vx:0,

            damage:2,

            type:"missile",

            explosive:true

        });


        player.cooldown =
            18;


        beep(
            260,
            .06,
            "sawtooth",
            .025
        );


        return;

    }



    /* NORMAL */

    bullets.push({

        x:
            player.x,

        y:
            player.y - 28,

        w:5,

        h:18,

        speed:10,

        vx:0,

        damage:1,

        type:"normal"

    });


    player.cooldown =
        7;


    beep(
        900,
        .035,
        "square",
        .018
    );

}



/* =========================================================
   COLLISION
   ========================================================= */

function hit(a,b){

    return (

        a.x - a.w / 2 <
        b.x + b.w / 2

        &&

        a.x + a.w / 2 >
        b.x - b.w / 2

        &&

        a.y - a.h / 2 <
        b.y + b.h / 2

        &&

        a.y + a.h / 2 >
        b.y - b.h / 2

    );

}



/* =========================================================
   PARTICLES
   ========================================================= */

function explode(
    x,
    y,
    count = 18
){

    for(
        let i = 0;
        i < count;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            .6 +
            Math.random() *
            3.2;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                18 +
                Math.random() *
                32,

            size:
                Math.random() < .55
                ? 2
                : 1,

            color:
                Math.random() < .55
                ? "#ff4f72"
                : "#ffbd4a"

        });

    }

}



/* =========================================================
   PLAYER DAMAGE
   ========================================================= */

function damagePlayer(){

    if(
        player.invincible > 0 ||
        state !== "playing"
    ){

        return;

    }


    lives--;


    player.invincible =
        110;


    shake =
        9;


    explode(
        player.x,
        player.y,
        32
    );


    beep(
        90,
        .22,
        "sawtooth",
        .045
    );


    if(
        lives <= 0
    ){

        lives =
            0;


        gameOver();

    }

}



/* =========================================================
   HEART COLLECTION
   ========================================================= */

function collectHeart(index){

    if(
        lives >= MAX_LIVES
    ){

        return;

    }


    const heart =
        hearts[index];


    lives =
        Math.min(
            MAX_LIVES,
            lives + 1
        );


    explode(
        heart.x,
        heart.y,
        20
    );


    hearts.splice(
        index,
        1
    );


    shake =
        3;


    beep(
        620,
        .08,
        "square",
        .035
    );


    setTimeout(
        () =>
            beep(
                930,
                .11,
                "square",
                .03
            ),
        80
    );

}



/* =========================================================
   UPDATE STARS
   ========================================================= */

function updateStars(){

    for(
        const star of stars
    ){

        star.y +=
            star.speed;


        if(
            star.y > H
        ){

            star.y =
                -2;


            star.x =
                Math.random() *
                W;

        }

    }

}



/* =========================================================
   BOSS SYSTEM
   ========================================================= */

function startBoss(levelNumber){

    if(
        boss ||
        !isBossLevel(levelNumber)
    ){

        return;

    }


    const bossIndex =
        BOSS_LEVELS.indexOf(levelNumber);


    const finalBoss =
        levelNumber === 100;


    const colors = [
        {
            main:"#ff315d",
            accent:"#54f5ff",
            glow:"#fff04a"
        },
        {
            main:"#54f5ff",
            accent:"#a84cff",
            glow:"#ffffff"
        },
        {
            main:"#ff7a35",
            accent:"#ff315d",
            glow:"#fff04a"
        },
        {
            main:"#9b5cff",
            accent:"#54f5ff",
            glow:"#ff315d"
        },
        {
            main:"#140d1f",
            accent:"#a84cff",
            glow:"#ff315d"
        }
    ];


    const palette =
        colors[bossIndex];


    boss = {

        level:levelNumber,

        final:finalBoss,

        name:finalBoss
            ? "FINAL BOSS"
            : `BOSS // ${String(levelNumber).padStart(2,"0")}`,

        x:W / 2,

        y:105,

        w:finalBoss ? 132 : 112,

        h:finalBoss ? 72 : 62,

        maxHp:
            280 + bossIndex * 140,

        hp:
            280 + bossIndex * 140,

        vx:
            finalBoss ? 1.35 : 1.05 + bossIndex * .08,

        shotTimer:
            75,

        phase:
            Math.random() * Math.PI * 2,

        main:
            palette.main,

        accent:
            palette.accent,

        glow:
            palette.glow

    };


    enemies = [];

    powerUps = [];

    bossBullets = [];

    shake = 8;


    explode(
        W / 2,
        110,
        finalBoss ? 40 : 28
    );


    beep(
        finalBoss ? 130 : 180,
        .18,
        "sawtooth",
        .045
    );


    setTimeout(
        () => beep(
            finalBoss ? 90 : 120,
            .22,
            "square",
            .038
        ),
        130
    );

}


function updateBoss(){

    if(!boss){
        return;
    }


    boss.x +=
        boss.vx;


    if(
        boss.x < boss.w / 2 + 20 ||
        boss.x > W - boss.w / 2 - 20
    ){

        boss.vx *= -1;

    }


    boss.y =
        96 +
        Math.sin(
            frame * .025 + boss.phase
        ) * 12;


    boss.shotTimer--;


    if(
        boss.shotTimer <= 0
    ){

        fireBossBurst();

        boss.shotTimer =
            boss.final
            ? 42
            : Math.max(
                48,
                68 -
                BOSS_LEVELS.indexOf(boss.level) * 4
            );

    }


    for(
        const shot of bossBullets
    ){

        shot.y +=
            shot.speed;

        shot.x +=
            shot.vx;

    }


    bossBullets =
        bossBullets.filter(
            shot =>
                shot.y < H + 30 &&
                shot.x > -30 &&
                shot.x < W + 30
        );


    if(
        player.invincible <= 0
    ){

        for(
            let i = bossBullets.length - 1;
            i >= 0;
            i--
        ){

            if(
                hit(
                    player,
                    bossBullets[i]
                )
            ){

                bossBullets.splice(i,1);

                damagePlayer();

                if(state !== "playing"){
                    return;
                }

                break;

            }

        }

    }


    if(
        player.invincible <= 0 &&
        hit(player,boss)
    ){

        damagePlayer();

    }

}


function fireBossBurst(){

    if(!boss){
        return;
    }


    const count =
        boss.final ? 5 : 3;


    const spread =
        boss.final ? .8 : .55;


    for(
        let i = 0;
        i < count;
        i++
    ){

        const offset =
            count === 1
            ? 0
            : (
                i -
                (count - 1) / 2
            ) * spread;


        bossBullets.push({

            x:boss.x + offset * 18,

            y:boss.y + boss.h / 2,

            w:8,

            h:14,

            speed:3.4 + (boss.level / 100) * 1.3,

            vx:offset * .55

        });

    }


    beep(
        boss.final ? 170 : 220,
        .05,
        "square",
        .018
    );

}


function damageBoss(damage){

    if(!boss){
        return false;
    }


    boss.hp -= damage;


    explode(
        boss.x,
        boss.y,
        6
    );


    if(boss.hp <= 0){

        defeatBoss();

    }


    return true;

}


function defeatBoss(){

    if(!boss){
        return;
    }


    const defeatedLevel =
        boss.level;


    const finalBoss =
        boss.final;


    const reward =
        1200 +
        defeatedLevel * 35;


    score += reward;


    explode(
        boss.x,
        boss.y,
        finalBoss ? 120 : 70
    );


    shake =
        finalBoss ? 16 : 10;


    beep(
        finalBoss ? 240 : 300,
        .16,
        "square",
        .04
    );


    setTimeout(
        () => beep(
            finalBoss ? 120 : 180,
            .22,
            "sawtooth",
            .04
        ),
        110
    );


    boss = null;

    bossBullets = [];


    nextBossLevel =
        BOSS_LEVELS[
            BOSS_LEVELS.indexOf(defeatedLevel) + 1
        ] || Infinity;


    if(finalBoss){

        /*
            The final boss is the end of the
            boss chain, but the existing game-over
            system remains unchanged.
        */

        nextBossLevel = Infinity;

    }

}


function drawBoss(){

    if(!boss){
        return;
    }


    const x =
        Math.round(boss.x);

    const y =
        Math.round(boss.y);


    /* OUTER BODY */

    px(
        x - boss.w / 2,
        y - boss.h / 2,
        boss.w,
        boss.h,
        boss.accent
    );


    px(
        x - boss.w / 2 + 8,
        y - boss.h / 2 + 7,
        boss.w - 16,
        boss.h - 14,
        boss.main
    );


    /* WINGS */

    px(
        x - boss.w / 2 - 16,
        y - 15,
        16,
        30,
        boss.accent
    );


    px(
        x + boss.w / 2,
        y - 15,
        16,
        30,
        boss.accent
    );


    /* CENTER CORE */

    px(
        x - 18,
        y - 19,
        36,
        38,
        boss.glow
    );


    px(
        x - 12,
        y - 13,
        24,
        26,
        boss.accent
    );


    px(
        x - 7,
        y - 8,
        14,
        16,
        boss.final
            ? "#ff315d"
            : "#fff04a"
    );


    /* CANNONS */

    px(
        x - boss.w / 2 + 14,
        y + 17,
        14,
        12,
        boss.accent
    );


    px(
        x + boss.w / 2 - 28,
        y + 17,
        14,
        12,
        boss.accent
    );


    /* FINAL BOSS CROWN */

    if(boss.final){

        px(
            x - 20,
            y - boss.h / 2 - 9,
            40,
            7,
            "#ff315d"
        );

        px(
            x - 12,
            y - boss.h / 2 - 16,
            8,
            9,
            "#a84cff"
        );

        px(
            x + 4,
            y - boss.h / 2 - 16,
            8,
            9,
            "#a84cff"
        );

    }

}


function drawBossBullets(){

    for(
        const shot of bossBullets
    ){

        px(
            shot.x - 4,
            shot.y - 7,
            8,
            14,
            boss && boss.final
                ? "#ff315d"
                : "#a84cff"
        );

        px(
            shot.x - 1,
            shot.y - 10,
            2,
            4,
            "#ffffff"
        );

    }

}


function drawBossHUD(){

    if(!boss){
        return;
    }


    txt(
        boss.name,
        W / 2,
        60,
        boss.final ? 10 : 8,
        boss.final ? "#ff315d" : boss.accent,
        "center"
    );


    const barX = 130;
    const barY = 70;
    const barW = 380;
    const barH = 7;


    px(
        barX,
        barY,
        barW,
        barH,
        "#241437"
    );


    px(
        barX,
        barY,
        barW * Math.max(
            0,
            boss.hp / boss.maxHp
        ),
        barH,
        boss.final
            ? "#ff315d"
            : boss.accent
    );

}


/* =========================================================
   NORMAL GAME UPDATE
   ========================================================= */

function updateGame(){

    level =
        Math.floor(
            score / 600
        ) + 1;


    /* BOSS CHECK */

    if(
        !boss &&
        level >= nextBossLevel &&
        isBossLevel(nextBossLevel)
    ){

        startBoss(nextBossLevel);

    }


    /* PLAYER */

    if(
        keys.ArrowLeft ||
        keys.KeyA
    ){

        player.x -=
            player.speed;

    }


    if(
        keys.ArrowRight ||
        keys.KeyD
    ){

        player.x +=
            player.speed;

    }


    if(
        keys.ArrowUp ||
        keys.KeyW
    ){

        player.y -=
            player.speed;

    }


    if(
        keys.ArrowDown ||
        keys.KeyS
    ){

        player.y +=
            player.speed;

    }


    player.x =
        Math.max(
            28,
            Math.min(
                W - 28,
                player.x
            )
        );


    player.y =
        Math.max(
            65,
            Math.min(
                H - 55,
                player.y
            )
        );


    if(
        keys.Space
    ){

        shoot();

    }


    if(
        player.cooldown > 0
    ){

        player.cooldown--;

    }


    if(
        player.invincible > 0
    ){

        player.invincible--;

    }


    updateWeapon();


    /* ENEMY SPAWN */

    if(!boss){

        enemyTimer--;


        if(
            enemyTimer <= 0
        ){

            spawnEnemy();


            enemyTimer =
                Math.max(
                    16,
                    48 -
                    level * 2.2
                );

        }

    }


    /* HEART SPAWN */

    heartTimer--;


    if(
        heartTimer <= 0
    ){

        spawnHeart();


        heartTimer =
            720 +
            Math.floor(
                Math.random() *
                400
            );

    }


    updateObjects();

}

/* =========================================================
   OBJECT UPDATE
   ========================================================= */

function updateObjects(){

    /* BULLETS */

    for(
        const bullet of bullets
    ){

        bullet.y -=
            bullet.speed;


        bullet.x +=
            bullet.vx || 0;

    }


    bullets =
        bullets.filter(
            bullet =>
                bullet.y > -70 &&
                bullet.x > -50 &&
                bullet.x < W + 50
        );


    /* BOSS */

    if(boss){

        updateBoss();


        for(
            let j = bullets.length - 1;
            j >= 0;
            j--
        ){

            const bullet =
                bullets[j];


            if(
                hit(
                    boss,
                    bullet
                )
            ){

                damageBoss(
                    bullet.damage || 1
                );

                bullets.splice(
                    j,
                    1
                );


                beep(
                    boss
                        ? 360
                        : 500,
                    .025,
                    "square",
                    .012
                );


                if(!boss){
                    break;
                }

            }

        }

    }



    /* ENEMIES */

    for(
        const enemy of enemies
    ){

        enemy.y +=
            enemy.speed;


        if(
            enemy.type === "drone"
        ){

            enemy.x +=
                Math.sin(
                    frame * .035 +
                    enemy.phase
                ) * .7;

        }


        if(
            enemy.type === "elite"
        ){

            enemy.x +=
                Math.sin(
                    frame * .022 +
                    enemy.phase
                ) * 1;

        }

    }



    /* HEARTS */

    for(
        const heart of hearts
    ){

        heart.y +=
            heart.speed;


        heart.x +=
            Math.sin(
                frame * .04 +
                heart.phase
            ) * .35;

    }



    /* POWER-UPS */

    updatePowerUps();



    /* BULLET -> ENEMY */

    for(
        let i =
            enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];


        for(
            let j =
                bullets.length - 1;
            j >= 0;
            j--
        ){

            const bullet =
                bullets[j];


            if(
                hit(
                    enemy,
                    bullet
                )
            ){

                enemy.hp -=
                    bullet.damage || 1;


                explode(
                    bullet.x,
                    bullet.y,
                    bullet.type === "laser"
                    ? 3
                    : 5
                );


                /*
                    Missile explosion.
                */

                if(
                    bullet.explosive
                ){

                    explode(
                        bullet.x,
                        bullet.y,
                        15
                    );


                    for(
                        let k =
                            enemies.length - 1;
                        k >= 0;
                        k--
                    ){

                        if(
                            k === i
                        ){

                            continue;

                        }


                        const nearby =
                            enemies[k];


                        const dx =
                            nearby.x -
                            bullet.x;


                        const dy =
                            nearby.y -
                            bullet.y;


                        const distance =
                            Math.sqrt(
                                dx * dx +
                                dy * dy
                            );


                        if(
                            distance < 65
                        ){

                            nearby.hp--;

                        }

                    }

                }


                /*
                    Non-piercing bullets disappear.
                */

                if(
                    !bullet.piercing
                ){

                    bullets.splice(
                        j,
                        1
                    );

                }


                if(
                    enemy.hp <= 0
                ){

                    const points =
                        enemy.type === "elite"
                        ? 250
                        : enemy.type === "tank"
                        ? 100
                        : 50;


                    score +=
                        points;


                    explode(
                        enemy.x,
                        enemy.y,
                        enemy.type === "elite"
                        ? 36
                        : 24
                    );


                    maybeDropPowerUp(
                        enemy
                    );


                    enemies.splice(
                        i,
                        1
                    );


                    shake =
                        enemy.type === "elite"
                        ? 7
                        : 3;


                    beep(
                        enemy.type === "elite"
                        ? 120
                        : enemy.type === "tank"
                        ? 180
                        : 270,

                        .09
                    );

                }

                else{

                    beep(
                        380,
                        .03
                    );

                }


                /*
                    A piercing laser can hit the
                    same enemy only once per frame.
                */

                if(
                    bullet.piercing
                ){

                    continue;

                }


                break;

            }

        }

    }



    /* PLAYER -> ENEMY */

    if(
        player.invincible <= 0
    ){

        for(
            let i =
                enemies.length - 1;
            i >= 0;
            i--
        ){

            if(
                hit(
                    player,
                    enemies[i]
                )
            ){

                enemies.splice(
                    i,
                    1
                );


                damagePlayer();


                break;

            }

        }

    }



    /* PLAYER -> HEART */

    for(
        let i =
            hearts.length - 1;
        i >= 0;
        i--
    ){

        if(
            hit(
                player,
                hearts[i]
            )
        ){

            collectHeart(i);

            break;

        }

    }



    /* MISSED OBJECTS */

    enemies =
        enemies.filter(
            enemy =>
                enemy.y < H + 70
        );


    hearts =
        hearts.filter(
            heart =>
                heart.y < H + 60
        );



    /* PARTICLES */

    for(
        const particle of particles
    ){

        particle.x +=
            particle.vx;


        particle.y +=
            particle.vy;


        particle.vy +=
            .035;


        particle.life--;

    }


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    if(
        shake > 0
    ){

        shake--;

    }

}



/* =========================================================
   ATTRACT MODE
   ========================================================= */

function startAttractMode(){

    state =
        "attract";


    attractFrame =
        0;


    demoScore =
        0;


    demoLives =
        3;


    demoLevel =
        1;


    bullets =
        [];


    enemies =
        [];


    hearts =
        [];


    powerUps =
        [];


    particles =
        [];


    boss =
        null;


    bossBullets =
        [];


    player.x =
        W / 2;


    player.y =
        H - 90;


    player.cooldown =
        0;


    player.invincible =
        999999;


    resetWeapon();


    demoTargetX =
        W / 2;


    demoTargetY =
        H - 100;

}



function exitAttractMode(){

    attractTimer =
        0;


    attractFrame =
        0;


    state =
        "title";


    bullets =
        [];


    enemies =
        [];


    hearts =
        [];


    powerUps =
        [];


    particles =
        [];


    boss =
        null;


    bossBullets =
        [];


    resetWeapon();


    player.x =
        W / 2;


    player.y =
        H - 75;

}

/* =========================================================
   DEMO UPDATE
   ========================================================= */

function updateAttract(){

    attractFrame++;


    if(
        attractFrame >=
        ATTRACT_DURATION
    ){

        exitAttractMode();

        return;

    }


    demoLevel =
        Math.floor(
            attractFrame / 700
        ) + 1;


    if(
        attractFrame % 100 === 0
    ){

        demoTargetX =
            60 +
            Math.random() *
            (W - 120);


        demoTargetY =
            95 +
            Math.random() *
            230;

    }


    if(
        player.x <
        demoTargetX - 3
    ){

        player.x +=
            player.speed * .7;

    }


    if(
        player.x >
        demoTargetX + 3
    ){

        player.x -=
            player.speed * .7;

    }


    if(
        player.y <
        demoTargetY - 3
    ){

        player.y +=
            player.speed * .45;

    }


    if(
        player.y >
        demoTargetY + 3
    ){

        player.y -=
            player.speed * .45;

    }


    player.x =
        Math.max(
            28,
            Math.min(
                W - 28,
                player.x
            )
        );


    player.y =
        Math.max(
            70,
            Math.min(
                H - 70,
                player.y
            )
        );


    if(
        player.cooldown > 0
    ){

        player.cooldown--;

    }


    /*
        Occasionally the demo changes weapon.
    */

    if(
        attractFrame > 1 &&
        attractFrame % 520 === 0
    ){

        giveWeapon(
            choosePowerUp()
        );

    }


    if(
        player.cooldown <= 0
    ){

        shoot();

    }


    enemyTimer--;


    if(
        enemyTimer <= 0
    ){

        spawnDemoEnemy();


        enemyTimer =
            Math.max(
                23,
                42 -
                demoLevel * 2
            );

    }


    heartTimer--;


    if(
        heartTimer <= 0
    ){

        spawnDemoHeart();


        heartTimer =
            450 +
            Math.floor(
                Math.random() *
                300
            );

    }


    /*
        Demo power-up drops.
    */

    if(
        attractFrame % 360 === 0
    ){

        spawnDemoPowerUp();

    }


    updateDemoObjects();

}



/* =========================================================
   DEMO HEART
   ========================================================= */

function spawnDemoHeart(){

    hearts.push({

        x:
            35 +
            Math.random() *
            (W - 70),

        y:-30,

        w:24,

        h:24,

        speed:
            .8 +
            Math.random() * .35,

        phase:
            Math.random() *
            Math.PI *
            2

    });

}



/* =========================================================
   DEMO OBJECT UPDATE
   ========================================================= */

function updateDemoObjects(){

    for(
        const bullet of bullets
    ){

        bullet.y -=
            bullet.speed;


        bullet.x +=
            bullet.vx || 0;

    }


    bullets =
        bullets.filter(
            bullet =>
                bullet.y > -70
        );



    for(
        const enemy of enemies
    ){

        enemy.y +=
            enemy.speed;


        if(
            enemy.type === "drone"
        ){

            enemy.x +=
                Math.sin(
                    frame * .035 +
                    enemy.phase
                ) * .7;

        }


        if(
            enemy.type === "elite"
        ){

            enemy.x +=
                Math.sin(
                    frame * .022 +
                    enemy.phase
                ) * 1;

        }

    }



    for(
        const heart of hearts
    ){

        heart.y +=
            heart.speed;


        heart.x +=
            Math.sin(
                frame * .04 +
                heart.phase
            ) * .35;

    }



    updatePowerUps();



    /* BULLET COLLISIONS */

    for(
        let i =
            enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];


        for(
            let j =
                bullets.length - 1;
            j >= 0;
            j--
        ){

            const bullet =
                bullets[j];


            if(
                hit(
                    enemy,
                    bullet
                )
            ){

                enemy.hp -=
                    bullet.damage || 1;


                explode(
                    bullet.x,
                    bullet.y,
                    5
                );


                if(
                    !bullet.piercing
                ){

                    bullets.splice(
                        j,
                        1
                    );

                }


                if(
                    enemy.hp <= 0
                ){

                    const points =
                        enemy.type === "elite"
                        ? 250
                        : enemy.type === "tank"
                        ? 100
                        : 50;


                    demoScore +=
                        points;


                    explode(
                        enemy.x,
                        enemy.y,
                        enemy.type === "elite"
                        ? 30
                        : 20
                    );


                    if(
                        Math.random() < .14
                    ){

                        spawnPowerUp(
                            enemy.x,
                            enemy.y
                        );

                    }


                    enemies.splice(
                        i,
                        1
                    );


                    shake =
                        enemy.type === "elite"
                        ? 5
                        : 2;

                }


                if(
                    !bullet.piercing
                ){

                    break;

                }

            }

        }

    }



    /* DEMO HEARTS */

    for(
        let i =
            hearts.length - 1;
        i >= 0;
        i--
    ){

        if(
            hit(
                player,
                hearts[i]
            )
        ){

            explode(
                hearts[i].x,
                hearts[i].y,
                15
            );


            hearts.splice(
                i,
                1
            );


            demoLives =
                Math.min(
                    5,
                    demoLives + 1
                );

        }

    }



    /* DEMO DAMAGE */

    for(
        let i =
            enemies.length - 1;
        i >= 0;
        i--
    ){

        if(
            hit(
                player,
                enemies[i]
            )
        ){

            enemies.splice(
                i,
                1
            );


            demoLives--;


            explode(
                player.x,
                player.y,
                25
            );


            shake =
                6;


            if(
                demoLives <= 0
            ){

                demoLives =
                    3;


                demoScore =
                    Math.max(
                        0,
                        demoScore - 150
                    );

            }


            player.x =
                W / 2;


            player.y =
                H - 100;

        }

    }



    enemies =
        enemies.filter(
            enemy =>
                enemy.y < H + 70
        );


    hearts =
        hearts.filter(
            heart =>
                heart.y < H + 60
        );



    for(
        const particle of particles
    ){

        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;

        particle.vy +=
            .035;

        particle.life--;

    }


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    if(
        shake > 0
    ){

        shake--;

    }

}



/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(){

    state =
        "gameover";


    if(
        score > highScore
    ){

        highScore =
            score;


        localStorage.setItem(
            "starFallHighScore",
            String(highScore)
        );

    }


    resetWeapon();


    boss =
        null;

    bossBullets =
        [];


    beep(
        180,
        .15,
        "sawtooth",
        .04
    );


    setTimeout(
        () =>
            beep(
                85,
                .25,
                "sawtooth",
                .035
            ),
        150
    );

}



/* =========================================================
   DRAW HELPERS
   ========================================================= */

function px(
    x,
    y,
    width,
    height,
    color
){

    ctx.fillStyle =
        color;


    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(width),
        Math.round(height)
    );

}



function txt(
    string,
    x,
    y,
    size,
    color = "#fff",
    align = "left"
){

    ctx.font =
        `${size}px "Press Start 2P",monospace`;


    ctx.textAlign =
        align;


    ctx.fillStyle =
        color;


    ctx.fillText(
        string,
        Math.round(x),
        Math.round(y)
    );

}



/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground(){

    ctx.fillStyle =
        "#090611";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        const star of stars
    ){

        const glow =
            Math.floor(
                120 +
                Math.sin(
                    frame * .04 +
                    star.x
                ) * 45
            );


        px(

            star.x,
            star.y,

            star.size,
            star.size,

            `rgb(
                ${glow},
                ${glow},
                ${Math.min(
                    255,
                    glow + 35
                )}
            )`

        );

    }



    for(
        let x = 0;
        x < W;
        x += 24
    ){

        const buildingHeight =
            16 +
            ((x * 17) % 48);


        px(
            x,
            H - 46 - buildingHeight,
            20,
            buildingHeight,
            "#110b20"
        );


        if(
            x % 48 === 0
        ){

            px(
                x + 5,
                H - 42 - buildingHeight,
                3,
                3,
                "#6e438e"
            );

        }


        if(
            x % 72 === 0
        ){

            px(
                x + 12,
                H - 57 - buildingHeight,
                2,
                2,
                "#54f5ff"
            );

        }

    }



    px(
        0,
        H - 46,
        W,
        1,
        "#8c3caf"
    );



    for(
        let i = 0;
        i < 22;
        i++
    ){

        const x =
            i * 32 -
            (
                frame * .7 % 32
            );


        px(
            x,
            H - 45,
            1,
            45,
            "#321849"
        );

    }



    for(
        let y = H - 36;
        y < H;
        y += 9
    ){

        px(
            0,
            y,
            W,
            1,
            "#241437"
        );

    }



    for(
        let i = 0;
        i < 9;
        i++
    ){

        const x =
            (
                i * 83 +
                38
            ) % W;


        const y =
            H -
            62 -
            (i % 4) * 11;


        px(
            x,
            y,
            2,
            6,
            "#ff315d"
        );


        px(
            x + 5,
            y + 2,
            2,
            3,
            "#54f5ff"
        );

    }

}

            ? "#fff04a"
            : bullet.type === "spread"
            ? "#54f5ff"
            : "#5dffff";


        px(
            bullet.x - 3,
            bullet.y,
            6,
            18,
            color
        );


        px(
            bullet.x - 1,
            bullet.y - 6,
            2,
            6,
            "#ffffff"
        );


        px(
            bullet.x - 6,
            bullet.y + 7,
            2,
            7,
            "#a84cff"
        );


        px(
            bullet.x + 4,
            bullet.y + 7,
            2,
            7,
            "#a84cff"
        );

    }

}



/* =========================================================
   POWER-UP DRAWING
   ========================================================= */

function drawPowerUp(
    powerUp
){

    const x =
        Math.round(powerUp.x);

    const y =
        Math.round(
            powerUp.y +
            Math.sin(
                frame * .09 +
                powerUp.phase
            ) * 2
        );


    const data =
        WEAPON_DATA[
            powerUp.type
        ];


    const color =
        data.color;


    /*
        Outer rotating-ish brackets.
    */

    px(
        x - 15,
        y - 15,
        5,
        5,
        color
    );


    px(
        x + 10,
        y - 15,
        5,
        5,
        color
    );


    px(
        x - 15,
        y + 10,
        5,
        5,
        color
    );


    px(
        x + 10,
        y + 10,
        5,
        5,
        color
    );


    /*
        Main box.
    */

    px(
        x - 11,
        y - 11,
        22,
        22,
        "#160d22"
    );


    px(
        x - 9,
        y - 9,
        18,
        18,
        color
    );


    px(
        x - 6,
        y - 6,
        12,
        12,
        "#160d22"
    );


    /*
        Icon.
    */

    if(
        powerUp.type === "spread"
    ){

        px(
            x - 2,
            y - 7,
            4,
            8,
            "#54f5ff"
        );

        px(
            x - 7,
            y - 3,
            4,
            7,
            "#54f5ff"
        );

        px(
            x + 3,
            y - 3,
            4,
            7,
            "#54f5ff"
        );

    }


    else if(
        powerUp.type === "rapid"
    ){

        px(
            x - 3,
            y - 7,
            6,
            8,
            "#fff04a"
        );

        px(
            x - 7,
            y - 1,
            10,
            5,
            "#fff04a"
        );

        px(
            x - 2,
            y + 4,
            6,
            4,
            "#fff04a"
        );

    }


    else if(
        powerUp.type === "laser"
    ){

        px(
            x - 2,
            y - 8,
            4,
            16,
            "#ff315d"
        );

        px(
            x - 6,
            y - 3,
            12,
            5,
            "#ffffff"
        );

    }


    else if(
        powerUp.type === "missile"
    ){

        px(
            x - 4,
            y - 7,
            8,
            12,
            "#a84cff"
        );

        px(
            x - 2,
            y - 10,
            4,
            4,
            "#fff04a"
        );

        px(
            x - 2,
            y + 5,
            4,
            5,
            "#ff315d"
        );

    }


    /*
        Little sparkle.
    */

    if(
        Math.floor(frame / 8) % 2 === 0
    ){

        px(
            x - 19,
            y - 2,
            3,
            3,
            "#ffffff"
        );

        px(
            x + 16,
            y + 5,
            3,
            3,
            "#ffffff"
        );

    }

}



function drawPowerUps(){

    for(
        const powerUp of powerUps
    ){

        drawPowerUp(
            powerUp
        );

    }

}



/* =========================================================
   HEART DRAWING
   ========================================================= */

function drawHeart(heart){

    const bob =
        Math.sin(
            frame * .09 +
            heart.phase
        ) * 2;


    const x =
        Math.round(
            heart.x
        );


    const y =
        Math.round(
            heart.y +
            bob
        );


    px(
        x - 7,
        y - 11,
        14,
        3,
        "#7c234a"
    );


    px(
        x - 11,
        y - 7,
        22,
        15,
        "#7c234a"
    );


    px(
        x - 8,
        y - 8,
        7,
        7,
        "#ff3f72"
    );

    px(
        x + 1,
        y - 8,
        7,
        7,
        "#ff3f72"
    );


    px(
        x - 10,
        y - 4,
        20,
        8,
        "#ff3f72"
    );


    px(
        x - 7,
        y + 4,
        14,
        5,
        "#ff3f72"
    );


    px(
        x - 3,
        y + 9,
        6,
        4,
        "#ff3f72"
    );


    px(
        x - 6,
        y - 7,
        3,
        3,
        "#ffd1dc"
    );


    px(
        x - 3,
        y - 4,
        2,
        2,
        "#fff"
    );

}



function drawHearts(){

    for(
        const heart of hearts
    ){

        drawHeart(
            heart
        );

    }

}



/* =========================================================
   PARTICLES
   ========================================================= */

function drawParticles(){

    for(
        const particle of particles
    ){

        px(
            particle.x,
            particle.y,
            particle.size,
            particle.size,
            particle.color
        );

    }

}

/* =========================================================
   TITLE
   ========================================================= */

function drawTitle(){

    drawBackground();


    const oldX =
        player.x;

    const oldY =
        player.y;


    player.x =
        W / 2 +
        Math.sin(
            frame * .025
        ) * 145;


    player.y =
        135 +
        Math.sin(
            frame * .045
        ) * 9;


    drawPlayer();


    player.x =
        oldX;

    player.y =

    drawLogo();

}



/* =========================================================
   ATTRACT DRAW
   ========================================================= */

function drawAttract(){

    drawBackground();


    drawDemoHUD();

    drawBullets();

    drawEnemies();

    drawPowerUps();

    drawHearts();

    drawParticles();

    drawPlayer();


    txt(
        "DEMO MODE",
        W / 2,
        58,
        8,
        "#b78cff",
        "center"
    );


    const visible =
        Math.floor(
            frame / 25
        ) % 2 === 0;


    if(
        visible
    ){

        txt(
            "INSERT COIN",
            W / 2 + 2,
            H - 27 + 2,
            11,
            "#ff315d",
            "center"
        );


        txt(
            "INSERT COIN",
            W / 2 - 2,
            H - 27,
            11,
            "#54f5ff",
            "center"
        );


        txt(
            "INSERT COIN",
            W / 2,
            H - 27,
            11,
            "#ffffff",
            "center"
        );

    }


    const progress =
        Math.min(
            1,
            attractFrame /
            ATTRACT_DURATION
        );


    px(
        120,
        H - 12,
        400,
        2,
        "#241437"
    );


    px(
        120,
        H - 12,
        400 * progress,
        2,
        "#8c32ff"
    );

}



/* =========================================================
   GAME OVER
   ========================================================= */

function drawGameOver(){

    drawBackground();

    drawEnemies();

    drawPowerUps();

    drawHearts();

    drawParticles();


    px(
        90,
        110,
        460,
        235,
        "#0c0714"
    );


    px(
        90,
        110,
        460,
        4,
        "#8c32ff"
    );


    px(
        90,
        341,
        460,
        4,
        "#8c32ff"
    );


    txt(
        "GAME OVER",
        W / 2,
        175,
        25,
        "#ff315d",
        "center"
    );


    txt(
        `SCORE ${String(score).padStart(7,"0")}`,
        W / 2,
        223,
        11,
        "#ffffff",
        "center"
    );


    txt(
        `HIGH ${String(highScore).padStart(7,"0")}`,
        W / 2,
        252,
        10,
        "#b78cff",
        "center"
    );


    if(
        Math.floor(
            frame / 30
        ) % 2 === 0
    ){

        txt(
            "PRESS R TO RETRY",
            W / 2,
            300,
            10,
            "#54f5ff",
            "center"
        );

    }

}



/* =========================================================
   MAIN UPDATE
   ========================================================= */

function update(){

    frame++;


    if(
        state === "title"
    ){

        updateLogo();


        attractTimer++;


        if(
            attractTimer >=
            ATTRACT_DELAY
        ){

            startAttractMode();

        }

    }


    updateStars();


    if(
        state === "attract"
    ){

        updateAttract();

        return;

    }


    if(
        state !== "playing" ||
        paused
    ){

        return;

    }


    updateGame();

}



/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw(){

    ctx.save();


    if(
        shake > 0
    ){

        ctx.translate(

            Math.round(
                Math.random() *
                shake -
                shake / 2
            ),

            Math.round(
                Math.random() *
                shake -
                shake / 2
            )

        );

    }


    if(
        state === "title"
    ){

        drawTitle();

    }


    else if(
        state === "attract"
    ){

        drawAttract();

    }


    else if(
        state === "playing"
    ){

        drawBackground();

        drawHUD();

        drawBossHUD();

        drawBullets();

        drawBossBullets();

        drawEnemies();

        drawBoss();

        drawPowerUps();

        drawHearts();

        drawParticles();

        drawPlayer();


        if(
            paused
        ){

            px(
                0,
                0,
                W,
                H,
                "rgba(0,0,0,.68)"
            );


            txt(
                "PAUSED",
                W / 2,
                220,
                25,
                "#ffffff",
                "center"
            );


            txt(
                "PRESS P",
                W / 2,
                252,
                10,
                "#b78cff",
                "center"
            );

        }

    }


    else{

        drawGameOver();

    }


    ctx.restore();

}



/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();

</script>
