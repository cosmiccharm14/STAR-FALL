<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR//FALL 1997</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08050e;
    font-family:"Press Start 2P",monospace;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.arcade{
    position:relative;
    width:min(94vw,1400px,calc(88vh * 4 / 3));
    aspect-ratio:4/3;
    background:#090611;
    border:10px solid #2b2340;
    box-shadow:
        0 0 0 5px #050309,
        0 0 45px #8b32ff55,
        inset 0 0 35px #000;
    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

.arcade:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0 1px,
            transparent 1px 4px
        );
}

.mobile-controls{
    display:none;
    position:fixed;
    left:12px;
    right:12px;
    bottom:14px;
    justify-content:space-between;
    z-index:20;
}

.dpad,
.action-buttons{
    display:flex;
    gap:6px;
}

.mobile-controls button{
    width:52px;
    height:52px;
    border:3px solid #8f6bca;
    background:#1a1127;
    color:white;
    font-family:inherit;
    font-size:12px;
}

@media(max-width:700px){

    .mobile-controls{
        display:flex;
    }

    .arcade{
        width:94vw;
        border-width:6px;
    }
}
</style>
</head>

<body>

<div class="arcade">
    <canvas id="game"></canvas>
</div>

<div class="mobile-controls">

    <div class="dpad">
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowUp">▲</button>
        <button data-key="ArrowDown">▼</button>
        <button data-key="ArrowRight">▶</button>
    </div>

    <div class="action-buttons">
        <button data-key="Space">●</button>
    </div>

</div>

<script>

"use strict";

/* =========================================================
   STAR//FALL 1997
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 640;
const H = 480;

canvas.width = W;
canvas.height = H;

ctx.imageSmoothingEnabled = false;


/* =========================================================
   GAME STATE
   ========================================================= */

let state = "title";
let paused = false;

let score = 0;

let highScore =
    Number(
        localStorage.getItem("starFallHighScore") || 0
    );

let lives = 3;
const MAX_LIVES = 5;

let level = 1;
let frame = 0;

let enemyTimer = 10;
let heartTimer = 650;

let shake = 0;

const keys = {};


const player = {

    x: W / 2,
    y: H - 75,

    w: 38,
    h: 42,

    speed: 4,

    cooldown: 0,
    invincible: 0

};


let bullets = [];
let enemies = [];
let hearts = [];
let particles = [];
let stars = [];


/* =========================================================
   STARFIELD
   ========================================================= */

for(let i = 0; i < 190; i++){

    stars.push({

        x: Math.random() * W,

        y: Math.random() * H,

        speed:
            .35 +
            Math.random() * 1.6,

        size:
            Math.random() < .88
            ? 1
            : 2

    });

}


/* =========================================================
   TITLE LOGO
   ========================================================= */

/*
    Custom geometric pixel logo.

    Each letter is represented by a 5x7 grid.

    This means the STAR/FALL logo does NOT depend
    on the Google font.

    The reference-style effect comes from:
      - white main blocks
      - dark grey offset
      - cyan ghost
      - red ghost
      - yellow micro-offset
      - falling letters
*/


const LOGO_FONT = {

    S:[
        "11111",
        "10000",
        "10000",
        "11111",
        "00001",
        "00001",
        "11111"
    ],

    T:[
        "11111",
        "00100",
        "00100",
        "00100",
        "00100",
        "00100",
        "00100"
    ],

    A:[
        "01110",
        "10001",
        "10001",
        "11111",
        "10001",
        "10001",
        "10001"
    ],

    R:[
        "11110",
        "10001",
        "10001",
        "11110",
        "10100",
        "10010",
        "10001"
    ],

    F:[
        "11111",
        "10000",
        "10000",
        "11110",
        "10000",
        "10000",
        "10000"
    ],

    L:[
        "10000",
        "10000",
        "10000",
        "10000",
        "10000",
        "10000",
        "11111"
    ]

};


/*
    Individual letters have their own falling physics.
*/

const logoLetters = [];


function setupLogo(){

    logoLetters.length = 0;

    const words = [
        {
            text:"STAR",
            y:92,
            scale:7,
            delay:0
        },
        {
            text:"FALL",
            y:190,
            scale:7,
            delay:24
        }
    ];


    for(const word of words){

        const spacing = 11 * word.scale;

        const totalWidth =
            word.text.length * 5 * word.scale +
            (word.text.length - 1) * spacing;

        const startX =
            (W - totalWidth) / 2;


        for(let i = 0; i < word.text.length; i++){

            logoLetters.push({

                char:word.text[i],

                x:
                    startX +
                    i * (
                        5 * word.scale +
                        spacing
                    ),

                targetY:word.y,

                y:
                    -180 -
                    Math.random() * 160,

                scale:word.scale,

                delay:
                    word.delay +
                    i * 7,

                velocity:
                    0,

                landed:false,

                rotation:
                    (Math.random() - .5) * .04

            });

        }

    }

}


setupLogo();


function updateLogo(){

    for(const letter of logoLetters){

        if(frame < letter.delay){
            continue;
        }


        if(!letter.landed){

            letter.velocity += .42;

            letter.y +=
                letter.velocity;


            if(
                letter.y >=
                letter.targetY
            ){

                letter.y =
                    letter.targetY;

                letter.velocity *=
                    -.28;


                if(
                    Math.abs(
                        letter.velocity
                    ) < .8
                ){

                    letter.velocity = 0;

                    letter.landed = true;

                }

            }

        }

    }

}


function drawPixelGlyph(
    char,
    x,
    y,
    scale,
    color,
    offsetX = 0,
    offsetY = 0
){

    const pattern =
        LOGO_FONT[char];

    if(!pattern) return;


    for(let row = 0; row < 7; row++){

        for(let col = 0; col < 5; col++){

            if(
                pattern[row][col] === "1"
            ){

                px(
                    x +
                    offsetX +
                    col * scale,

                    y +
                    offsetY +
                    row * scale,

                    scale,
                    scale,
                    color
                );

            }

        }

    }

}


/*
    Draws the same letter several times with tiny
    chromatic offsets.

    This is what gives it that old CRT / arcade
    print-registration look.
*/

function drawLogoLetter(letter){

    const x =
        Math.round(letter.x);

    const y =
        Math.round(letter.y);

    const s =
        letter.scale;


    /*
        DARK OUTLINE
    */

    drawPixelGlyph(
        letter.char,
        x - 2,
        y + 3,
        s,
        "#050509"
    );


    drawPixelGlyph(
        letter.char,
        x + 3,
        y + 2,
        s,
        "#050509"
    );


    /*
        CYAN GHOST
    */

    drawPixelGlyph(
        letter.char,
        x - 4,
        y,
        s,
        "#54f5ff"
    );


    /*
        RED GHOST
    */

    drawPixelGlyph(
        letter.char,
        x + 4,
        y,
        s,
        "#ff315d"
    );


    /*
        YELLOW MICRO GHOST
    */

    drawPixelGlyph(
        letter.char,
        x + 1,
        y - 2,
        s,
        "#fff04a"
    );


    /*
        MAIN GREY BODY
    */

    drawPixelGlyph(
        letter.char,
        x,
        y,
        s,
        "#d9d9d9"
    );


    /*
        BRIGHT WHITE highlight,
        slightly offset upward.
    */

    drawPixelGlyph(
        letter.char,
        x,
        y - 1,
        s,
        "#f4f4f4"
    );

}


function drawLogo(){

    /*
        Tiny glitch movement occasionally happens
        to individual letters.
    */

    for(const letter of logoLetters){

        let originalX =
            letter.x;

        let glitchX = 0;

        if(
            letter.landed &&
            Math.random() < .012
        ){

            glitchX =
                Math.random() < .5
                ? -2
                : 2;

        }

        letter.x =
            originalX + glitchX;

        drawLogoLetter(letter);

        letter.x =
            originalX;

    }


    /*
        Tiny horizontal scan fragments.
    */

    if(
        Math.floor(frame / 18) % 5 === 0
    ){

        for(let i = 0; i < 3; i++){

            const y =
                70 +
                Math.random() * 170;

            px(
                90 +
                Math.random() * 400,
                y,
                25 +
                Math.random() * 65,
                1,
                Math.random() < .5
                ? "#54f5ff"
                : "#ff315d"
            );

        }

    }

}


/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener("keydown", e => {

    keys[e.code] = true;

    if([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Space"
    ].includes(e.code)){

        e.preventDefault();

    }


    if(
        e.code === "Enter" &&
        (
            state === "title" ||
            state === "gameover"
        )
    ){

        startGame();

    }


    if(
        e.code === "KeyR" &&
        state === "gameover"
    ){

        startGame();

    }


    if(
        e.code === "KeyP" &&
        state === "playing"
    ){

        paused = !paused;

    }

});


window.addEventListener("keyup", e => {

    keys[e.code] = false;

});


document
.querySelectorAll(".mobile-controls button")
.forEach(button => {

    const key =
        button.dataset.key;


    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );

});


/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx = null;


function initAudio(){

    if(!audioCtx){

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioCtx.state === "suspended"
    ){

        audioCtx.resume();

    }

}


function beep(
    frequency,
    duration,
    type = "square",
    volume = 0.025
){

    if(!audioCtx) return;


    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime +
        duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration
    );

}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    initAudio();

    state = "playing";

    paused = false;

    score = 0;

    lives = 3;

    level = 1;

    frame = 0;

    enemyTimer = 10;

    heartTimer = 650;

    shake = 0;

    bullets = [];

    enemies = [];

    hearts = [];

    particles = [];


    player.x =
        W / 2;

    player.y =
        H - 75;

    player.cooldown = 0;

    player.invincible = 90;


    beep(
        330,
        .09
    );


    setTimeout(
        () => beep(
            660,
            .12
        ),
        90
    );

}


/* =========================================================
   ENEMY SPAWNING
   ========================================================= */

function spawnEnemy(){

    const roll =
        Math.random();


    if(
        roll < .58
    ){

        enemies.push({

            type:"drone",

            x:
                30 +
                Math.random() *
                (W - 60),

            y:-35,

            w:34,
            h:28,

            speed:
                1.1 +
                Math.random() * .8 +
                level * .06,

            hp:1,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }


    else if(
        roll < .88
    ){

        enemies.push({

            type:"tank",

            x:
                35 +
                Math.random() *
                (W - 70),

            y:-45,

            w:46,
            h:38,

            speed:
                .75 +
                Math.random() * .65 +
                level * .045,

            hp:2,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }


    else{

        enemies.push({

            type:"elite",

            x:
                50 +
                Math.random() *
                (W - 100),

            y:-55,

            w:56,
            h:48,

            speed:
                .55 +
                Math.random() * .5 +
                level * .035,

            hp:4,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }

}


/* =========================================================
   HEART PICKUPS
   ========================================================= */

function spawnHeart(){

    if(
        lives >= MAX_LIVES
    ){

        return;

    }


    hearts.push({

        x:
            35 +
            Math.random() *
            (W - 70),

        y:-30,

        w:24,
        h:24,

        speed:
            .8 +
            Math.random() * .35,

        phase:
            Math.random() *
            Math.PI *
            2

    });

}


/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

    if(
        player.cooldown > 0
    ){

        return;

    }


    bullets.push({

        x:player.x,

        y:player.y - 28,

        w:5,

        h:18,

        speed:10

    });


    player.cooldown = 7;


    beep(
        900,
        .035,
        "square",
        .018
    );

}


/* =========================================================
   COLLISION
   ========================================================= */

function hit(a,b){

    return (

        a.x - a.w / 2 <
        b.x + b.w / 2

        &&

        a.x + a.w / 2 >
        b.x - b.w / 2

        &&

        a.y - a.h / 2 <
        b.y + b.h / 2

        &&

        a.y + a.h / 2 >
        b.y - b.h / 2

    );

}


/* =========================================================
   PARTICLES
   ========================================================= */

function explode(
    x,
    y,
    count = 18
){

    for(
        let i = 0;
        i < count;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            .6 +
            Math.random() *
            3.2;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                18 +
                Math.random() *
                32,

            size:
                Math.random() < .55
                ? 2
                : 1,

            color:
                Math.random() < .55
                ? "#ff4f72"
                : "#ffbd4a"

        });

    }

}


/* =========================================================
   PLAYER DAMAGE
   ========================================================= */

function damagePlayer(){

    if(
        player.invincible > 0 ||
        state !== "playing"
    ){

        return;

    }


    lives--;

    player.invincible = 110;

    shake = 9;


    explode(
        player.x,
        player.y,
        32
    );


    beep(
        90,
        .22,
        "sawtooth",
        .045
    );


    if(
        lives <= 0
    ){

        lives = 0;

        gameOver();

    }

}


/* =========================================================
   HEART COLLECTION
   ========================================================= */

function collectHeart(index){

    if(
        lives >= MAX_LIVES
    ){

        return;

    }


    const heart =
        hearts[index];


    lives =
        Math.min(
            MAX_LIVES,
            lives + 1
        );


    explode(
        heart.x,
        heart.y,
        20
    );


    hearts.splice(
        index,
        1
    );


    shake = 3;


    beep(
        620,
        .08,
        "square",
        .035
    );


    setTimeout(
        () => beep(
            930,
            .11,
            "square",
            .03
        ),
        80
    );

}


/* =========================================================
   UPDATE
   ========================================================= */

function update(){

    frame++;


    /* title logo */

    if(
        state === "title"
    ){

        updateLogo();

    }


    /* stars */

    for(
        const star of stars
    ){

        star.y +=
            star.speed;


        if(
            star.y > H
        ){

            star.y = -2;

            star.x =
                Math.random() *
                W;

        }

    }


    if(
        state !== "playing" ||
        paused
    ){

        return;

    }


    level =
        Math.floor(
            score / 600
        ) + 1;


    /* PLAYER */

    if(
        keys.ArrowLeft ||
        keys.KeyA
    ){

        player.x -=
            player.speed;

    }


    if(
        keys.ArrowRight ||
        keys.KeyD
    ){

        player.x +=
            player.speed;

    }


    if(
        keys.ArrowUp ||
        keys.KeyW
    ){

        player.y -=
            player.speed;

    }


    if(
        keys.ArrowDown ||
        keys.KeyS
    ){

        player.y +=
            player.speed;

    }


    player.x =
        Math.max(
            28,
            Math.min(
                W - 28,
                player.x
            )
        );


    player.y =
        Math.max(
            65,
            Math.min(
                H - 55,
                player.y
            )
        );


    if(
        keys.Space
    ){

        shoot();

    }


    if(
        player.cooldown > 0
    ){

        player.cooldown--;

    }


    if(
        player.invincible > 0
    ){

        player.invincible--;

    }


    /* ENEMY SPAWN */

    enemyTimer--;


    if(
        enemyTimer <= 0
    ){

        spawnEnemy();


        enemyTimer =
            Math.max(
                16,
                48 -
                level * 2.2
            );

    }


    /* HEART SPAWN */

    heartTimer--;


    if(
        heartTimer <= 0
    ){

        spawnHeart();


        heartTimer =
            720 +
            Math.floor(
                Math.random() *
                400
            );

    }


    /* BULLETS */

    for(
        const bullet of bullets
    ){

        bullet.y -=
            bullet.speed;

    }


    bullets =
        bullets.filter(
            bullet =>
                bullet.y > -35
        );


    /* ENEMIES */

    for(
        const enemy of enemies
    ){

        enemy.y +=
            enemy.speed;


        if(
            enemy.type === "drone"
        ){

            enemy.x +=
                Math.sin(
                    frame * .035 +
                    enemy.phase
                ) * .7;

        }


        if(
            enemy.type === "elite"
        ){

            enemy.x +=
                Math.sin(
                    frame * .022 +
                    enemy.phase
                ) * 1;

        }

    }


    /* HEARTS */

    for(
        const heart of hearts
    ){

        heart.y +=
            heart.speed;


        heart.x +=
            Math.sin(
                frame * .04 +
                heart.phase
            ) * .35;

    }


    /* BULLET -> ENEMY */

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];


        for(
            let j = bullets.length - 1;
            j >= 0;
            j--
        ){

            const bullet =
                bullets[j];


            if(
                hit(
                    enemy,
                    bullet
                )
            ){

                bullets.splice(
                    j,
                    1
                );


                enemy.hp--;


                explode(
                    bullet.x,
                    bullet.y,
                    5
                );


                if(
                    enemy.hp <= 0
                ){

                    const points =
                        enemy.type === "elite"
                        ? 250
                        : enemy.type === "tank"
                        ? 100
                        : 50;


                    score += points;


                    explode(
                        enemy.x,
                        enemy.y,
                        enemy.type === "elite"
                        ? 36
                        : 24
                    );


                    enemies.splice(
                        i,
                        1
                    );


                    shake =
                        enemy.type === "elite"
                        ? 7
                        : 3;


                    beep(
                        enemy.type === "elite"
                        ? 120
                        : enemy.type === "tank"
                        ? 180
                        : 270,

                        .09
                    );

                }

                else{

                    beep(
                        380,
                        .03
                    );

                }


                break;

            }

        }

    }


    /* PLAYER -> ENEMY */

    if(
        player.invincible <= 0
    ){

        for(
            let i = enemies.length - 1;
            i >= 0;
            i--
        ){

            if(
                hit(
                    player,
                    enemies[i]
                )
            ){

                enemies.splice(
                    i,
                    1
                );


                damagePlayer();


                break;

            }

        }

    }


    /* PLAYER -> HEART */

    for(
        let i = hearts.length - 1;
        i >= 0;
        i--
    ){

        if(
            hit(
                player,
                hearts[i]
            )
        ){

            collectHeart(i);

            break;

        }

    }


    /* MISSED ENEMIES */

    enemies =
        enemies.filter(
            enemy =>
                enemy.y < H + 70
        );


    hearts =
        hearts.filter(
            heart =>
                heart.y < H + 60
        );


    /* PARTICLES */

    for(
        const particle of particles
    ){

        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;

        particle.vy +=
            .035;

        particle.life--;

    }


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    if(
        shake > 0
    ){

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(){

    state = "gameover";


    if(
        score > highScore
    ){

        highScore = score;


        localStorage.setItem(
            "starFallHighScore",
            String(highScore)
        );

    }


    beep(
        180,
        .15,
        "sawtooth",
        .04
    );


    setTimeout(
        () => beep(
            85,
            .25,
            "sawtooth",
            .035
        ),
        150
    );

}


/* =========================================================
   DRAW HELPERS
   ========================================================= */

function px(
    x,
    y,
    width,
    height,
    color
){

    ctx.fillStyle =
        color;


    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(width),
        Math.round(height)
    );

}


function txt(
    string,
    x,
    y,
    size,
    color = "#fff",
    align = "left"
){

    ctx.font =
        `${size}px "Press Start 2P",monospace`;


    ctx.textAlign =
        align;


    ctx.fillStyle =
        color;


    ctx.fillText(
        string,
        Math.round(x),
        Math.round(y)
    );

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground(){

    ctx.fillStyle =
        "#090611";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    for(
        const star of stars
    ){

        const glow =
            Math.floor(
                120 +
                Math.sin(
                    frame * .04 +
                    star.x
                ) * 45
            );


        px(
            star.x,
            star.y,
            star.size,
            star.size,

            `rgb(
                ${glow},
                ${glow},
                ${Math.min(
                    255,
                    glow + 35
                )}
            )`
        );

    }


    /* skyline */

    for(
        let x = 0;
        x < W;
        x += 24
    ){

        const buildingHeight =
            16 +
            ((x * 17) % 48);


        px(
            x,
            H - 46 - buildingHeight,
            20,
            buildingHeight,
            "#110b20"
        );


        if(
            x % 48 === 0
        ){

            px(
                x + 5,
                H - 42 - buildingHeight,
                3,
                3,
                "#6e438e"
            );

        }


        if(
            x % 72 === 0
        ){

            px(
                x + 12,
                H - 57 - buildingHeight,
                2,
                2,
                "#54f5ff"
            );

        }

    }


    /* horizon */

    px(
        0,
        H - 46,
        W,
        1,
        "#8c3caf"
    );


    /* perspective grid */

    for(
        let i = 0;
        i < 22;
        i++
    ){

        const x =
            i * 32 -
            (
                frame * .7 % 32
            );


        px(
            x,
            H - 45,
            1,
            45,
            "#321849"
        );

    }


    for(
        let y = H - 36;
        y < H;
        y += 9
    ){

        px(
            0,
            y,
            W,
            1,
            "#241437"
        );

    }


    /* neon signs */

    for(
        let i = 0;
        i < 9;
        i++
    ){

        const x =
            (
                i * 83 +
                38
            ) % W;


        const y =
            H -
            62 -
            (i % 4) * 11;


        px(
            x,
            y,
            2,
            6,
            "#ff315d"
        );


        px(
            x + 5,
            y + 2,
            2,
            3,
            "#54f5ff"
        );

    }

}

            frame / 30
        ) % 2 === 0
    ){

        txt(
            "PRESS R TO RETRY",
            W / 2,
            300,
            10,
            "#54f5ff",
            "center"
        );

    }

}


/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw(){

    ctx.save();


    if(
        shake > 0
    ){

        ctx.translate(

            Math.round(
                Math.random() *
                shake -
                shake / 2
            ),

            Math.round(
                Math.random() *
                shake -
                shake / 2
            )

        );

    }


    if(
        state === "title"
    ){

        drawTitle();

    }


    else if(
        state === "playing"
    ){

        drawBackground();

        drawHUD();

        drawBullets();

        drawEnemies();

        drawHearts();

        drawParticles();

        drawPlayer();


        if(
            paused
        ){

            px(
                0,
                0,
                W,
                H,
                "rgba(0,0,0,.68)"
            );


            txt(
                "PAUSED",
                W / 2,
                220,
                25,
                "#ffffff",
                "center"
            );


            txt(
                "PRESS P",
                W / 2,
                252,
                10,
                "#b78cff",
                "center"
            );

        }

    }


    else{

        drawGameOver();

    }


    ctx.restore();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();

</script>
